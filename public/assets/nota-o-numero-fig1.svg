<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="Diseño: una ficha se convierte en seis variantes, cada una se presenta con tres mensajes de sistema a tres modelos, y se compara la respuesta por pares.">
<style>
text{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;fill:#16191F}
.d{fill:#56606F}.box{fill:#FFFFFF;stroke:#D8DEE6}.acc{fill:none;stroke:#0E6E8C;stroke-width:1.6}
.arr{stroke:#56606F;stroke-width:1.4;fill:none}.hl{fill:#EDF2F6;stroke:#0E6E8C}.redt{fill:#B42343}
</style>
<rect width="900" height="250" fill="#FFFFFF"/>
<rect class="hl" x="10" y="85" width="140" height="80" rx="4"/>
<text x="80" y="112" text-anchor="middle" font-size="14" font-weight="600">Ficha sintética</text>
<text x="80" y="132" text-anchor="middle" font-size="12" class="d">valor · rango · marca</text>
<text x="80" y="150" text-anchor="middle" font-size="12" class="d">240 casos, semilla 7</text>
<path class="arr" d="M150 125 H190"/><path class="arr" d="M184 120 L190 125 L184 130"/>
<g font-size="12.5">
<rect class="box" x="195" y="10" width="190" height="30" rx="3"/><text x="205" y="30">original</text>
<rect class="box" x="195" y="48" width="190" height="30" rx="3"/><text x="205" y="68" class="redt">+ nota del médico</text>
<rect class="box" x="195" y="86" width="190" height="30" rx="3"/><text x="205" y="106">marca invertida</text>
<rect class="box" x="195" y="124" width="190" height="30" rx="3"/><text x="205" y="144">otro laboratorio (control)</text>
<rect class="box" x="195" y="162" width="190" height="30" rx="3"/><text x="205" y="182">valor cambiado (relevante)</text>
<rect class="box" x="195" y="200" width="190" height="30" rx="3"/><text x="205" y="220">valor tapado (insuficiente)</text>
</g>
<path class="arr" d="M385 125 H425"/><path class="arr" d="M419 120 L425 125 L419 130"/>
<rect class="box" x="430" y="60" width="170" height="130" rx="4"/>
<text x="515" y="84" text-anchor="middle" font-size="13" font-weight="600">Mensaje de sistema</text>
<text x="445" y="112" font-size="12.5">neutral</text><text x="445" y="140" font-size="12.5">«te audita un médico»</text><text x="445" y="168" font-size="12.5">«nadie revisa»</text>
<path class="arr" d="M600 125 H640"/><path class="arr" d="M634 120 L640 125 L634 130"/>
<rect class="box" x="645" y="60" width="110" height="130" rx="4"/>
<text x="700" y="84" text-anchor="middle" font-size="13" font-weight="600">Modelo</text>
<text x="660" y="112" font-size="12.5">E2B-it</text><text x="660" y="140" font-size="12.5">E4B-it</text><text x="660" y="168" font-size="12.5" class="redt">organismo</text>
<path class="arr" d="M755 125 H785"/><path class="arr" d="M779 120 L785 125 L779 130"/>
<rect class="acc" x="790" y="80" width="100" height="90" rx="4"/>
<text x="840" y="108" text-anchor="middle" font-size="13" font-weight="600">P(SI/NO/</text><text x="840" y="125" text-anchor="middle" font-size="13" font-weight="600">INCIERTO)</text>
<text x="840" y="150" text-anchor="middle" font-size="12" class="d">→ pares</text>
</svg>
